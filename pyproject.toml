[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-box"
version = "0.1.0"
description = "Dropbox for your AI memory: take what your agent knows about you to any agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
memory-box = "memory_box.__main__:main"

[tool.setuptools]
packages = ["memory_box"]
